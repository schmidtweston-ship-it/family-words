<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Words</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#8a3b12"><link rel="apple-touch-icon" href="icon-192.png">
<style>
body{margin:0;background:#fff3d6;color:#3b2412;font-family:Verdana,Arial,sans-serif;font-size:28px;line-height:1.4}
h1{background:#8a3b12;color:#fff3d6;margin:0;padding:28px 20px;font-size:48px;text-align:center}
h2{background:#d98a2b;color:#3b2412;margin:40px 0 0;padding:20px;font-size:42px;text-align:center}
.item{margin:24px 16px;padding:24px;background:#fde7c2;border:5px solid #8a3b12;border-radius:24px;text-align:center}
.item img{width:100%;max-width:420px;height:auto}
.name{font-size:40px;font-weight:bold;margin:12px 0 6px}
.say{font-size:30px;margin:0}
</style></head><body><h1>Family Words</h1><main id="m"></main>
<script>
fetch('words.json?'+Date.now()).then(r=>r.json()).then(d=>{const m=document.getElementById('m');
for(const s of d.sections){const h=document.createElement('h2');h.textContent=s.title;m.append(h);
for(const e of s.entries){const v=document.createElement('div');v.className='item';
const i=new Image();i.src=e.icon;i.alt='';const n=document.createElement('div');n.className='name';n.textContent=e.word;
const p=document.createElement('p');p.className='say';p.textContent=e.meaning;v.append(i,n,p);m.append(v)}}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
