<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Words</title><meta name="theme-color" content="#7a2e1f">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<style>
body{margin:0;background:#3b1d4a;color:#ffe8b0;font:20px/1.5 system-ui,sans-serif}
header{background:#7a2e1f;padding:20px;text-align:center}h1{margin:0;font-size:2em;color:#ffd166}
main{padding:14px;max-width:700px;margin:auto}
section{background:#5a2a63;border-left:8px solid #ff9f1c;border-radius:14px;padding:14px;margin:16px 0}
h2{color:#ffd166;margin:0 0 8px;font-size:1.35em}.note{color:#9ef0d0;font-style:italic}
.e{background:#14535c;border-radius:10px;padding:12px;margin:10px 0}
.w{font-weight:800;font-size:1.25em;color:#ffcf5c}.m{color:#fff1d6}
</style></head><body><header><h1>Family Words</h1></header><main id="app">Loading…</main>
<script>
fetch('words.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
const a=document.getElementById('app');a.textContent='';
d.sections.forEach(s=>{const sec=document.createElement('section');
const h=document.createElement('h2');h.textContent=s.title;sec.append(h);
if(s.note){const p=document.createElement('p');p.className='note';p.textContent=s.note;sec.append(p)}
s.entries.forEach(e=>{const div=document.createElement('div');div.className='e';
const w=document.createElement('div');w.className='w';w.textContent=e.word;
const m=document.createElement('div');m.className='m';m.textContent=e.meaning;div.append(w,m);sec.append(div)});
a.append(sec)})}).catch(()=>{document.getElementById('app').textContent='Could not load words.'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
